# Metropolis CI — M0 skeleton.
#
# Module key: foundation.repo (see code.json)
# Spec ref:   M0-ENG §5; A8
#
# main is always green (M0-ENG §5): build, unit tests, gofmt, go vet on
# every push/PR. The determinism gate, UI snapshot tests, invariant suite
# and perf smoke (M0-ENG §5, §1.2 step 5) land with the modules that make
# them meaningful — they are not stubbed here, they simply do not exist
# yet.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-vet:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      - name: go test ./...
        run: go test ./...

      - name: gofmt check
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            Write-Host "The following files are not gofmt-formatted:"
            Write-Host $files
            exit 1
          }

