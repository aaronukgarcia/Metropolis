# Metropolis CI — M0 skeleton.
#
# Module key: foundation.repo (see code.json)
# Spec ref:   M0-ENG §5; A8; §1.2 point 5 (determinism gate); GR#21;
#             BUG-002 (lint job arming); SEC-028 (race detector gate)
#
# main is always green (M0-ENG §5): build, unit tests, gofmt, go vet on
# every push/PR, plus (as of the feat.detgate/FEAT-004 sprint 1 arming)
# the determinism gate and golangci-lint. UI snapshot tests, invariant
# suite and perf smoke (M0-ENG §5, §1.2 step 5) land with the modules
# that make them meaningful — they are not stubbed here, they simply do
# not exist yet.
#
# `go test` runs with -race (SEC-028) in both build-test-vet and
# determinism-gate — see the inline comments at each step for why. Until
# SEC-028's first real CI run is watched, treat -race-on-windows-latest as
# probable but not confirmed (ASM-090).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # workflow_dispatch (BUG-034): lets a human trigger perf-1m-probe
  # on demand, from any branch that carries this file, without needing
  # a push/PR event — see that job's own comment block for why it
  # exists and is manual-only rather than wired into every push/PR.
  #
  # BUG-095: this used to also carry accept_perf_regression/
  # accept_perf_regression_reason workflow_dispatch inputs, forwarded
  # into cmd/perfci's now-removed -accept-regression/-accept-reason
  # flags. Destructive-9 live-verified that mechanism was a full bypass
  # of BUG-083's fix: those two flags just set two fields on the SAME
  # results-file record any second writer (a corrupted-cache restore, a
  # hand edit, a re-uploaded artifact) can already forge, so "a human
  # typed this into a workflow_dispatch form" was never actually
  # provable from the persisted record alone. Accepting a regression is
  # now done by committing an entry to perf-accepted-regressions.json
  # (see internal/harness/synth/accepted.go and cmd/perfci's package
  # doc comment) — an ordinary, reviewed PR, not a workflow input — so
  # there is nothing left for workflow_dispatch to carry for this.
  workflow_dispatch: {}

jobs:
  build-test-vet:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      # -race (SEC-028, GR#21): CI's plain `go test ./...` was proven to pass
      # 10/10 against a reintroduced SEC-003-shape defect (unlocked
      # concurrent map read) while `-race` failed 5/5 against the same
      # broken build — the entire SEC-003..SEC-020 concurrency-safety chain
      # was verified only by a step nobody's automated gate ran. windows-latest
      # ships a working GCC/MinGW toolchain (confirmed via the runner-images
      # README: gcc 14.2.0, binutils, gdb — cgo needs no extra setup step),
      # and -race only ~2.8x's this suite's local runtime (~10s -> ~28s), so
      # this extends the existing step rather than paying for a second
      # checkout+setup-go job (ASM-090: windows-latest's cgo toolchain is
      # confirmed present per actions/runner-images' README, but still
      # unverified on the actual runner until the first real CI run — see
      # docs/planning/dev-team-process.md Tester-baseline line).
      - name: go test ./... -race
        run: go test ./... -race -count=1 -timeout 20m

      - name: gofmt check
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            Write-Host "The following files are not gofmt-formatted:"
            Write-Host $files
            exit 1
          }

  # --- Determinism gate (FEAT-004, GR#21) -------------------------------
  # Master doc §1.2 point 5: "CI runs the determinism gate on every
  # merge." A red result here is AUTOMATICALLY P0 (Rule #21,
  # docs/golden-rules-detail.md) and blocks every other merge until
  # green — see internal/engine/detgate's doc comment and
  # TestDeterminismGate's failure message for the full statement.
  # timeout-minutes is explicit (not left at the Actions default) per
  # feat.detgate AC-6 — the gate itself runs in well under a second on
  # the stub engine; 10 minutes is a generous CI-cold-start budget, not
  # a tuned figure, so a hang fails fast and visibly rather than
  # silently eating the job's full default budget.
  determinism-gate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: go build ./...
        run: go build ./...

      # -race here too (SEC-028): this gate is exactly the kind of
      # concurrency-critical path the finding is about, and the added cost
      # is a few seconds on a single test.
      - name: Determinism gate (TestDeterminismGate)
        run: go test ./internal/engine/detgate/ -run TestDeterminismGate -count=1 -race

  # --- Lint (A8 mechanical enforcement / BUG-002) -----------------------
  # golangci-lint enforces GR#20 (internal/ui must not import
  # internal/engine — see .golangci.yml's depguard rule) mechanically,
  # not by review. Version is PINNED (never `latest` — GR#2 Version
  # Discipline: an unpinned linter version can start failing a green
  # build on a Tuesday with no code change). The custom determinism
  # rules (map-range ban on tick paths, mandatory pre-allocation) arm in
  # a later sprint alongside more of foundation.det / engine.core going
  # real; the escape-analysis (`-gcflags="-m"`) and `gctrace` perf gates
  # are separate A8 checks, out of scope for this job (feat.detgate's
  # acceptance doc "Out of scope").
  lint:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

  # --- Node test suite (BUG-200, P1, mkey foundation.repo) ---------------
  # Before this job, ci.yml ran zero `node --test` — every claude-*.js
  # guard/tooling script and tools/plan's tests (731 tests as of this
  # fix, confirmed by a local `node --test` run at the repo root) were
  # enforced only by local discipline, not CI. Live consequence: a
  # committed self-falsifying test (BUG-199) reached main and nothing
  # would ever have flagged it.
  #
  # runs-on: ubuntu-latest, NOT windows-latest like every other job in
  # this file. Two reasons, both deliberate:
  #   1. GitHub Actions' `services:` (Docker service containers, used
  #      below for MariaDB) are only supported on Linux runners — not
  #      Windows or macOS. There is no windows-latest equivalent.
  #   2. A local audit of this job (grep across every *.test.js) found
  #      no dependency on a real Windows shell (PowerShell/pwsh) being
  #      invoked by the scripts under test, nor any hardcoded
  #      Windows-only path outside of comments and platform-conditional
  #      test fixtures (e.g. claude-bow.test.js's win.ini path-traversal
  #      fixture is itself process.platform-gated). The suite already
  #      runs clean on this Linux-capable subset locally.
  # If a genuinely Windows-only node test surfaces later, the fix is a
  # SEPARATE windows-latest job for that subset, not moving this whole
  # job off Linux and losing the standard `services:` mechanism.
  #
  # DB-dependent tests (claude-bow.test.js, claude-sync.test.js, and
  # others) connect to a real MariaDB over METRO_DB_* env vars and
  # create/drop their OWN scratch databases per test file (e.g.
  # metro_test_bowlint, metro_test_syncmsg) — they do not touch a
  # shared `metro` DB. That maps directly onto a `services: mariadb`
  # container: no skip-and-hope-nobody-notices mechanism, no
  # silently-green skip (GR#17 / this project's verification
  # standards: "a gate that can't evaluate must not report success") —
  # the service container is genuinely there, so these tests run for
  # real in CI for the first time.
  node-test:
    runs-on: ubuntu-latest
    # SPLIT into 3 shards (2026-09-04, the "split before raising again" branch
    # of the comment below, taken the same day): the suite crossed the raised
    # 30-minute ceiling too (run 33866623643 killed at 30m17s) after another
    # day of landings — attack-bug646-round alone now measures ~170s. Node's
    # own --test-shard partitions the discovered test FILES deterministically
    # across shards, so each shard runs ~1/3 of the suite under the same
    # 30-minute ceiling (~2-3x headroom each). The check names become
    # "node-test (1/3)" etc.; node-test is NOT in the required-status-check
    # set (verified via the branch-protection API before renaming), so no
    # branch-protection edit is needed.
    #
    # History: timeout raised 15 -> 30 (2026-09-04): the suite grew past 15
    # minutes in one day of landings (the consolidator estate's real-savepoint
    # perf probes, the chunked-replay family, the worker-offload suites) and
    # the job hit its ceiling with a "cancelled" step conclusion three runs in
    # a row — which reads as an external cancel and cost a debugging cycle to
    # attribute.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ""
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      METRO_DB_HOST: 127.0.0.1
      METRO_DB_PORT: 3306
      METRO_DB_USER: root
      METRO_DB_PASSWORD: ""
    steps:
      # fetch-depth: 0 (full history, not actions/checkout@v4's default
      # shallow fetch-depth: 1) -- BUG-207: claude-pre-commit-check.test.js's
      # "AC-C3 (load-bearing proof): last pre-demotion revision DOES deny"
      # test walks git log back to a specific pre-demotion revision, which a
      # depth-1 checkout does not have available and the test reports as
      # "walked 1 revision(s)".
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # BUG-207: the CI runner has no global git identity, so a `git commit`
      # invoked by a test (claude-author-identity.test.js's "SEC-052 ROUND 2
      # precondition" and "control(b)" subtests) fails for real with "Please
      # tell me who you are". Throwaway/CI-only identity, scoped to this job
      # only -- not used for anything this repo actually pushes.
      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI Runner"

      # GR#23/FEAT-045 fixture: claude-committhook.test.js and
      # claude-author-identity.test.js prove the REAL, INSTALLED
      # .git/hooks/commit-msg copy (not just the tracked source) rejects a
      # fabricated identity end-to-end. A fresh CI checkout never runs
      # `npm install`'s postinstall or any manual install step, so
      # .git/hooks/commit-msg is absent on the runner and every "the
      # installed hook fires ..." / "the installed .git/hooks copy" test
      # fails for real — not an app-code regression, just an infra gap
      # this repo's own dev machines don't have (installed once, by hand).
      # This step is inert for this job's own git operations: node-test
      # never commits to this checkout (tests spin up throwaway temp repos
      # via `git init` in os.tmpdir(), verified by grep across the test
      # suite), so an author/codename-guarded commit-msg hook sitting in
      # THIS repo's .git/hooks has nothing of this job's own to intercept.
      - name: Install git hooks (commit-msg identity + codename guard)
        run: node claude-committhook-install.js install

      - name: npm ci
        run: npm ci

      # FEAT-1972079935: the webconsole test glob now imports lz-string (a real
      # runtime dependency in webconsole/package.json), so webconsole's OWN
      # node_modules must exist before `node --test` discovers those tests --
      # the root `npm ci` above does not install webconsole's deps. Runs from
      # webconsole/package-lock.json.
      - name: npm ci (webconsole)
        working-directory: webconsole
        run: npm ci

      # claude-bow.js/claude-sync.js connect with `database: metro` set
      # (or METRO_DB_NAME's override) already selected — mysql2 does NOT
      # auto-create a missing database, it errors (ER_BAD_DB_ERROR). The
      # mariadb service above starts with only the server up, no
      # database of any name. Create `metro` here (matching this
      # project's own default/local-dev DB name, since a handful of
      # tests — e.g. claude-destructive-guard.test.js — deliberately
      # connect to whatever METRO_DB_NAME resolves to, defaulting to
      # 'metro', rather than a private scratch DB), then run each
      # script's own `init` command so ensureSchema() creates every
      # bow_*/sync_*/project_meta table for real — not a hand-copied
      # schema dump that could drift from the source of truth.
      - name: Create metro database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -e "CREATE DATABASE IF NOT EXISTS metro CHARACTER SET utf8mb4;"

      - name: Initialize metro schema (bow_* + sync_* tables)
        run: |
          node claude-bow.js init
          node claude-sync.js init

      # BUG-424 / version-stamp.test.mjs: the webconsole imports its
      # generated version stamp (src/generated/version.ts) at test-import
      # time, but that file is GITIGNORED and only ever created by running
      # gen-version.mjs -- normally triggered by a dev's `npm run dev`/build
      # or the post-commit hook, never by a bare CI checkout. Generate it
      # here so the import resolves; the script is pure node stdlib
      # (child_process + fs), no webconsole npm install required, and
      # degrades to a safe placeholder if `git describe` ever fails (see
      # the script's own header comment) so this step cannot itself go red.
      - name: Generate webconsole version stamp
        working-directory: webconsole
        run: node scripts/gen-version.mjs

      - name: node --test
        run: node --test --test-shard=${{ matrix.shard }}/3

  # --- Perf smoke (H-SYNTH / MOD-016, M0-ENG §6 point 5) -----------------
  # cmd/perfci (internal/harness/synth/cmd/perfci) is the CI-runnable perf
  # gate AC-6 asks for: generate a synthetic city, run it N months through
  # the real harness.headless path, compare monthly-tick time against a
  # stored baseline, exit non-zero on a >10% regression (AC-10). This job
  # proves that PLUMBING is real and wired into CI — baseline persistence
  # across runs via actions/cache (restore-keys falls back to the most
  # recent prior cache under the same key prefix, so perf-results.ndjson
  # accumulates one record per run rather than starting fresh every time,
  # AC-5), the command actually running, and a non-zero exit actually
  # failing this job (AC-10 verified end to end, not just unit-tested).
  #
  # BUG-083 + ASM-353: the "Save perf-results baseline" step below is
  # `if: always()`, but it no longer has a poisoned baseline to save.
  # cmd/perfci's finishGate now refuses to append a genuinely regressed
  # run AT ALL (ASM-353: a regressed run must never become the new
  # baseline), and LoadLatestBaseline reconstructs the baseline by
  # REPLAYING history and freezing at the last record that did not
  # regress as a read-boundary defence (BUG-083, still needed for legacy
  # files and the second-writer routes BUG-073/085/095 name). Before
  # those two fixes a caught, red-CI regression silently became the next
  # run's comparison point, because it was appended before exit and then
  # cached regardless of the job's own pass/fail result. The
  # `if: always()` save is kept so a genuine PASS's record (and the cache
  # itself) is always persisted even if a later step hiccups. See
  # internal/harness/synth/results.go's LoadLatestBaseline doc comment
  # for the full replay mechanism, including the live-verified 30-commit,
  # 13.27x, zero-signal drift it closes and the SECOND, anchor-based
  # check (CumulativeRegressionThreshold) alongside the freeze itself.
  #
  # Deliberately -citizens-overridden to a small count (see cmd/perfci's
  # -citizens flag doc comment), NOT the real 1M-citizen preset AC-6 names
  # for the eventual production gate. Two reasons, both logged as an
  # assumption against this item's BOW record rather than silently
  # decided: (1) this repo has not yet measured how long a real 1M-citizen
  # headless run takes on a windows-latest Actions runner — CLAUDE.md's
  # own -race-on-windows-latest note ("treat as probable but not
  # confirmed" until watched) is the same caution applied here, and a perf
  # job is exactly the wrong place to discover a runner is too slow via a
  # timeout; (2) at this sprint, engine.core is a walking skeleton with
  # zero registered phase hooks (see internal/harness/synth/doc.go's
  # "Generated content is a Sprint-1-skeleton stand-in" note), so a
  # smoke-scale run already exercises the exact same near-zero tick-time
  # path a full 1M-citizen run would today — the citizen count changes
  # Generate's cost, not engine.core's, until Sprint 3 lands real phase
  # hooks. Wiring the FULL 1M/10M-scale, merge-blocking gate is follow-up
  # work once both of those are resolved, consistent with this item's
  # acceptance doc's own "Out of scope" carve-out ("wiring the perf CI job
  # into an actual CI runner configuration ... may be a follow-up BOW item
  # if the repo's CI infrastructure isn't ready").
  perf-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    # BUG-097: actions: write is needed ONLY by the cache-pruning step
    # below (gh cache delete) -- everything else this job does needs no
    # more than the default read access.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # BUG-735: derive the cache-key suffix MECHANICALLY from
      # synth.PhaseHookCountInHeadlessPath() (via cmd/perfci's new
      # -print-hook-count flag) instead of a hand-bumped vN literal. Every
      # time a compose phase hook is added/removed, this number changes on
      # its own, the cache key below changes with it, and the stale
      # baseline is orphaned automatically — closing the v7->v8->v9->v10->v11
      # hand-bump churn (three bumps in three days, each one a human
      # remembering to edit ~8 literal occurrences of the same string in
      # this file). PERF_KEY_SUFFIX still carries a human-bumpable epoch
      # (see the "vN-hooks<N>" shape below) so a baseline can still be
      # invalidated by hand for a reason OTHER than a hook-count change
      # (e.g. BUG-254's measurement-regime change, BUG-529's money-loop
      # fix) — bump the literal "v12" segment for that, exactly as v3/v8
      # were bumped before this fix; do NOT bump it for a hook-count change,
      # since that case is now handled automatically.
      - name: Derive perf cache-key suffix from PhaseHookCount (BUG-735)
        shell: bash
        run: echo "PERF_KEY_SUFFIX=v12-hooks$(go run ./internal/harness/synth/cmd/perfci -print-hook-count)" >> "$GITHUB_ENV"

      # BUG-034 FIX-LANDING REQUIREMENT (2026-08-11): the cache key
      # carries a generation segment (v2) precisely so THIS commit
      # discards the poisoned pre-fix smoke history. Live production
      # trace (BUG-071/BUG-083 BOW comments): a docs-only commit's run
      # went red on 283.6% runner jitter, the failing run's 44ms number
      # was laundered into the baseline (AppendResult-before-exit +
      # if:always() cache save), and the next run then skipped its
      # comparison against that garbage and reported GREEN. Every v1
      # cache entry descends from that history; none of it is a
      # trustworthy comparison point. Bumping the generation orphans the
      # v1 entries (restore-keys below can no longer match them), so the
      # first post-fix run starts a fresh, honestly-measured history
      # (AC-8 first-run behaviour) instead of being judged against
      # noise. Bump the generation again ONLY with a recorded reason of
      # this kind — an unexplained bump silently discards real history,
      # which is its own way of un-gating the gate.
      #
      # v3 (BUG-254, 2026-08-17): the measurement regime changed — the
      # perfci step below now runs -months 500 (was 96, widened for BUG-271: BUG-269's speedup dropped the 96-month window below the 50ms floor) and RunPerf takes a
      # median of synth.TickSampleCount tick windows, with the noise
      # floor re-scoped to the measured window (see limits.go's
      # MinMeasurableDuration). Every v2 record carries Months=3, so the
      # first v3-regime run would hit CompareToBaseline's ScaleMismatch
      # against it — an honest could-not-evaluate, but a permanent one.
      # Orphaning the v2 entries lets the first post-fix run establish a
      # fresh, honestly-measured baseline (AC-8 first-run behaviour),
      # exactly the mechanism the v2 bump above already established.
      #
      # v8 (BUG-529, 2026-09-02, Aaron ruling Q100049=A1; fixed same day
      # after the v8 bump alone did not go green — see the "v8 fix" note
      # below): every v7 record was measured BEFORE BUG-529 fixed
      # compose.residentIDs()'s money loop, which had silently processed
      # only ~64 of 2000 citizens (migrants/fertility children were
      # never enumerated). BUG-529 restored full-population pay,
      # legitimately raising AllocBytes/AllocCount ~247%/~386%
      # (~175M/~1.14M -> ~607M/~5.54M at this job's own 2000-citizen
      # scale, locally re-measured at BUG-547's landing commit 009cbf5)
      # — a correct cost increase, not something to optimise back down.
      # Orphaning the v7 entries lets the very next run establish a
      # fresh, honestly-measured baseline at the corrected level (AC-8
      # first-run behaviour) instead of every future commit being judged
      # against a stale, pre-fix number forever.
      #
      # v8 FIX (same-day follow-up, 2026-09-02): the original v8 landing
      # ALSO added a perf-accepted-regressions.json entry naming commit
      # 009cbf5 as an audit-trail record — this broke BOTH perf jobs on
      # every run (exit 2, not the expected AC-8 exit 0), because
      # actions/checkout@v4 defaults to a SHALLOW clone (fetch-depth 1)
      # on this job (no override here, unlike node-test's fetch-depth: 0
      # for its own unrelated reason), and internal/harness/synth's
      # BUG-245 git-provenance loader hard-verifies every ledger entry's
      # commitHash resolves via `git rev-parse --verify <hash>^{commit}`
      # — which fails closed on a shallow checkout for any commit older
      # than the single fetched one. Live-verified by cloning the real
      # public repo with --depth 1: `git rev-parse --verify
      # 009cbf5...^{commit}` exits 1, and perfci built from that clone
      # printed "perfci: reading accepted-regressions registry: ...
      # references commit ... which is not a real commit in this
      # repository (BUG-245)" and exited 2 — reproduced identically for
      # both perf-smoke and perf-1m-probe, since they share this same
      # ledger file and checkout step. The ledger entry was never
      # actually load-bearing for the fix (the v8 cache-key bump alone
      # already gives AC-8's "no prior baseline -> exit 0" behaviour on
      # the first post-bump run), so perf-accepted-regressions.json is
      # back to an empty array — this file's own BUG-529 rationale now
      # lives ONLY in this comment block, not as a ledger entry, to avoid
      # depending on git history depth this job does not fetch. If a
      # future acceptance entry is ever added here, either add
      # `fetch-depth: 0` to this job's Checkout step first, or name a
      # commit no older than the single commit a depth-1 checkout always
      # has (its own HEAD) — never an older ancestor.
      - name: Restore perf-results baseline
        uses: actions/cache@v4
        with:
          path: perf-results.ndjson
          key: perf-results-1m-smoke-${{ env.PERF_KEY_SUFFIX }}-${{ github.run_id }}
          restore-keys: |
            perf-results-1m-smoke-${{ env.PERF_KEY_SUFFIX }}-

      # BUG-071: cmd/perfci now exits a DISTINCT code (3) when the gate
      # could not evaluate a regression (ScaleMismatch or, live-verified
      # in this item's Destructive attack, BelowNoiseFloor — the common
      # case at this job's deliberate -citizens smoke override, see the
      # comment block above this job). That is expected and NOT a code
      # problem at smoke scale, so this step does not let exit 3 fail the
      # job — but it also does not silently swallow it: it prints an
      # explicit, loud "::warning::" annotation so the distinction stays
      # visible in the Actions UI rather than folding back into an
      # indistinguishable green check, which is the exact failure this
      # item exists to close. Any OTHER non-zero exit (1 = genuine
      # regression, 2 = usage/system error) still fails the job normally.
      # BUG-110, ROOT CAUSE (corrected after two live failures, runs
      # 31539027958 and 31539765424): `go run` LAUNDERS the child's exit
      # code -- it prints "exit status N" to stderr and then itself
      # exits 1 for ANY nonzero child status. So perfci's three-outcome
      # exit-code contract (0/1/2/3, BUG-071) never survived `go run` on
      # any shell: the step always saw 1, the exit-3 mapping below could
      # never match, and the first diagnosis (pwsh wrapper semantics)
      # was a plausible-but-wrong story the bash migration disproved.
      # The fix is the same thing perf-1m-probe already does: BUILD the
      # binary and run it directly, so $? is perfci's own exit code.
      #
      # ASM-375: -accepted-regressions is wired here explicitly (same
      # flag and path as perf-1m-probe below) so perf-smoke has the SAME
      # deliberate, human-reviewed escape hatch perf-1m-probe does. The
      # file itself (perf-accepted-regressions.json) is checked out with
      # the rest of the repo, so a regression acceptance is recorded by a
      # reviewed commit, never by a value typed into this job — the exact
      # BUG-095 mechanism. It is safe on this automatic push/PR job
      # precisely because the registry can only gain an entry via a real
      # commit, not via a workflow input.
      - name: perfci (1M preset, -citizens smoke override)
        shell: bash
        run: |
          set -e
          go build -o perfci-smoke.exe ./internal/harness/synth/cmd/perfci
          set +e
          ./perfci-smoke.exe -preset 1M -citizens 2000 -months 500 -results perf-results.ndjson -commit ${{ github.sha }} -accepted-regressions perf-accepted-regressions.json
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "::warning title=perf gate could not evaluate::cmd/perfci exited 3 (BUG-071 could-not-evaluate) -- expected at this job's smoke scale (below MinMeasurableDuration or a CitizenCount mismatch against the stored smoke baseline). This is NOT a pass and NOT a regression verdict; the real merge-blocking gate is perf-1m-probe's 1M scale. See internal/harness/synth/cmd/perfci's run() doc comment for the three-outcome exit-code design."
            exit 0
          fi
          exit "$code"

      - name: Save perf-results baseline
        if: always()
        uses: actions/cache/save@v4
        with:
          path: perf-results.ndjson
          key: perf-results-1m-smoke-${{ env.PERF_KEY_SUFFIX }}-${{ github.run_id }}

      # BUG-097: this job's save key above is unique per run (github.run_id)
      # because actions/cache/save cannot overwrite an existing key -- but
      # left unmanaged, that means one NEW cache entry accumulates under
      # the perf-results-1m-smoke- prefix on every single run, forever,
      # with nothing in this repo ever deleting an old one. GitHub enforces
      # a per-repo cache storage cap with LRU eviction, so this pattern
      # eventually manufactures the exact condition BUG-097 is about: a
      # restore-keys prefix match coming up empty not because this preset
      # was never measured, but because our own accumulation strategy
      # pushed the real history out. Pruning down to a small number of the
      # newest entries under this prefix removes that self-inflicted risk
      # (a fresh, real cache entry is always available at that point) --
      # it does not fix cmd/perfci's inability to tell "genuinely first
      # run" from "lost cache" at read time (see run()'s BUG-097 stderr
      # note for that half), but it makes the loss this specific mechanism
      # would otherwise cause far less likely to occur at all.
      #
      # Best-effort housekeeping, not a correctness gate: continue-on-error
      # so a `gh cache` permission/API hiccup (e.g. a fork PR running with
      # reduced GITHUB_TOKEN scope) never fails this job over a cleanup
      # step that has nothing to do with the perf gate itself.
      - name: Prune old perf-results-1m-smoke caches (BUG-097)
        if: always()
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prefix = "perf-results-1m-smoke-$env:PERF_KEY_SUFFIX-"
          $keepNewest = 3
          $raw = gh cache list --repo ${{ github.repository }} --key $prefix --limit 100 --json id,key,createdAt
          if (-not $raw) { Write-Host "no cache entries listed under prefix $prefix"; exit 0 }
          $entries = $raw | ConvertFrom-Json
          $stale = $entries | Sort-Object -Property createdAt -Descending | Select-Object -Skip $keepNewest
          foreach ($e in $stale) {
            Write-Host "deleting stale cache entry $($e.key) (id $($e.id), created $($e.createdAt))"
            gh cache delete $e.id --repo ${{ github.repository }}
          }

  # --- Real-scale 1M probe (BUG-034, P0) ---------------------------------
  # BUG-034: nobody had measured a real 1M-citizen headless run's wall
  # time, peak memory, or allocation counts on windows-latest before this
  # item — perf-smoke above deliberately runs a small -citizens override
  # (see its own comment) specifically BECAUSE that was true, and using
  # an unmeasured 1M run as a hard timeout/scale gate untested would risk
  # discovering a runner limit via a job timeout rather than a
  # deliberate measurement.
  #
  # This job is the measurement AND, as of the BUG-034 gate flip (commit
  # 5bfc381, 2026-08-12 — see the GATE FLIP note further down this
  # block), the required merge-blocking gate: it runs on every push/PR
  # and stays workflow-dispatchable. It was originally written
  # workflow_dispatch-only (manual) for exactly one reason — the real
  # 1M-citizen headless run had never been measured on windows-latest, so
  # it could not become a merge-blocking gate before a human had watched
  # at least one real run complete and confirmed it fits comfortably
  # inside a CI job's time and memory budget. That first run happened
  # (run 31539765424, commit 303d3ac: 6.73s wall / 43.2MB peak, well
  # inside the 20-minute budget), so the flip below was made with
  # evidence rather than hope — shipping the gate before that measurement
  # would have been the exact unverified-gate failure mode BUG-034 exists
  # to close.
  #
  # # What it measures, separately (BUG-034's "record generation cost and
  # # tick cost as SEPARATE figures" instruction)
  #
  # -preset 1M with NO -citizens override (unlike perf-smoke) — the real
  # 1,000,000-citizen synthetic. cmd/perfci's own PerfResult already keeps
  # GenerationTime (world generation, the dominant cost while engine.core
  # carries zero registered PhaseHooks — see synth/doc.go) and TickTime/
  # PerMonthTick (the figure that becomes meaningful once Sprint 3 lands
  # real phase hooks) as genuinely separate fields, plus PhaseHookCount
  # traveling alongside every result (synth/phasehooks.go) so a reader can
  # never mistake a walking-skeleton tick figure for a simulated one. This
  # job additionally wraps the whole perfci invocation in a PowerShell
  # Stopwatch (wall time) and polls Process.PeakWorkingSet64 (peak
  # memory) — neither of which cmd/perfci itself measures, both of which
  # BUG-034 asks for explicitly.
  #
  # # Baseline persistence (BUG-034 item 2: "the baseline must be recorded
  # # from CI, not locally")
  #
  # Identical mechanism to perf-smoke above (actions/cache with a
  # restore-keys prefix — the same "no CI infrastructure invented, reuse
  # what already works" reasoning), but under its OWN cache key
  # (perf-results-1m-real-) so the smoke-scale and real-scale histories
  # never collide or get compared against each other. The FIRST run under
  # this key has no prior baseline (AC-8 behaviour, LoadLatestBaseline
  # returns nil) and records itself as the new one; every run after that
  # compares against the most recent prior real-1M CI measurement — a
  # baseline that was always taken on windows-latest, never on a
  # contributor's dev box, closing the exact local-vs-CI divergence
  # CLAUDE.md's Docker section already names as this project's recurring
  # failure class.
  #
  # timeout-minutes is deliberately generous (20, vs perf-smoke's 10):
  # this job's whole purpose is to find out whether 1M fits inside a
  # normal CI budget, not to assume it does — a job that times out here
  # IS a valid, informative result (see this item's BOW report for what
  # to do with that outcome), not a mistake to silence by raising the
  # limit further.
  # BUG-057: no concurrency guard meant two workflow_dispatch runs
  # triggered close together could both restore the SAME prior baseline
  # (actions/cache's restore-keys prefix match), both append their own
  # measurement in isolation, and both save under distinct
  # ${{ github.run_id }}-keyed cache entries — no file corruption, but
  # whichever run's cache entry the NEXT run's prefix match happens to
  # pick becomes the sole ancestor baseline, silently discarding the
  # other run's measurement with no log, warning, or tie-break policy.
  # Harmless today only because this job is manual and never fails the
  # build (if: always()); it stops being harmless the moment this job
  # becomes the real merge-blocking gate. group: with
  # cancel-in-progress: false queues a second dispatch behind the first
  # rather than racing them or cancelling either — losing an in-flight
  # measurement to a cancel would be its own silent-discard problem, and
  # this job's whole point is to produce a trustworthy measurement, not
  # merely the fastest one.
  # BUG-034 GATE FLIP (Aaron's ruling, 2026-08-12; exit-3 hard-fail flipped
  # by FEAT-082, 2026-08-15): this job is no longer manual-only — it runs on
  # every push/PR AND stays dispatchable, and it is a REQUIRED merge check.
  # Exit semantics:
  #   exit 1 (genuine regression)  — FAILS the job, blocks the merge.
  #   exit 2 (system/poisoned data) — FAILS the job, blocks the merge.
  #   exit 3 (could-not-evaluate)  — FAILS the job, blocks the merge.
  #        FEAT-082 landed the composition root, so real phase hooks now
  #        exist and there IS a cost to protect; the "warn now, hard-fail
  #        at S3" interim expired (BUG-034/ASM-352's recorded mandatory
  #        condition). The ::warning:: retained in the run step is a
  #        diagnostic on the way to the non-zero exit, never a terminal
  #        pass. perf-smoke's exit-3 warning is OUT of scope and stays.
  # BUG-665, 2026-09-04, THE HONESTY FIX (Aaron/Q100168 asked for a
  # named-check rename or repoint -- that is a repo-admin action on
  # branch protection's required-checks list, which this workflow file
  # cannot perform on its own; see the loud annotation step below and
  # this item's own BOW report for the exact steps Aaron/the lead needs
  # to run once ready). Until that happens, this job's NAME on GitHub's
  # required-checks list keeps advertising "the real merge-blocking 1M
  # scale gate" when it has never once ticked 1,000,000 citizens --
  # `internal/harness/synth`'s `-preset 1M` only ever fed 1,000,000 into
  # `Generate()`'s throwaway synthetic-record cost model
  # (`internal/harness/synth/headless_seam.go`'s `runHeadless`), and
  # `harness.headless.Config` (the struct that ACTUALLY constructs and
  # ticks a real `citizens.CitizensAPI`) had no citizen-count field at
  # all until this same commit added `SeedCitizenCount` -- so the engine
  # this job has ticked, every single run since it went live, has always
  # held compose's own ~64-citizen genesis-only seed population,
  # regardless of the "1M" in its name and its preset flag.
  #
  # This job is LEFT RUNNING AS-IS below (green, unmodified logic) --
  # its generation-cost measurement is real and worth keeping, it is
  # just mislabelled. The REAL population-scale gate is the separate
  # `perf-population-probe` job further down, which seeds and ticks an
  # ACTUAL 1,000,000-citizen population via the new `SeedCitizenCount`
  # plumbing (`internal/harness/headless/bug665_population_perf_gate_test.go`).
  perf-1m-probe:
    runs-on: windows-latest
    timeout-minutes: 20
    concurrency:
      group: perf-1m-probe-${{ github.ref }}
      cancel-in-progress: false
    # BUG-097: actions: write is needed ONLY by the cache-pruning step
    # below (gh cache delete) -- see perf-smoke's identical block for the
    # full rationale.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # BUG-665 loud annotation (THE HONESTY FIX): this step does no
      # work -- it exists solely to print an unmissable warning
      # annotation on every run of this job, in the GitHub Actions UI,
      # for as long as this job's name keeps overstating what it proves.
      # See the job-level comment block immediately above for the full
      # story and go-engine-100m-proving-plan.md §1.1 for the measured
      # proof (this job's own local re-run: GenerationTime ~30s for 1M
      # throwaway records, TickTime measured against a few-thousand-
      # citizen city, never 1M real citizens).
      - name: "BUG-665: this check's name overstates what it proves"
        shell: pwsh
        run: |
          Write-Host "::warning title=perf-1m-probe never ticks 1M citizens (BUG-665)::This REQUIRED check's name claims a 1M-citizen scale gate. It does not provide one: the '1M' preset feeds internal/harness/synth's throwaway Generate() cost model only -- the engine this job actually ticks has always held compose's own ~64-citizen genesis seed, regardless of the preset. The real population-scale gate is the separate 'perf-population-probe' job (internal/harness/headless, SeedCitizenCount). This job's own generation-cost measurement below is real and kept as-is -- only its NAME is the defect. Renaming/repointing the branch-protection required-check entry is a repo-admin action outside this workflow file's own reach -- see BUG-665's BOW report for the exact rename instructions once ready to apply."
          "## :warning: perf-1m-probe naming defect (BUG-665)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "This REQUIRED check has never ticked 1,000,000 citizens -- see the job's own header comment in .github/workflows/ci.yml and docs/planning/go-engine-100m-proving-plan.md section 1.1. The real population-scale gate is the 'perf-population-probe' job." | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # BUG-735: same mechanical derivation as perf-smoke's own step above
      # (see that job's comment block for the full rationale) — this job's
      # cache key is a SEPARATE key from perf-smoke's, so it needs its own
      # PERF_KEY_SUFFIX in its own $GITHUB_ENV, but the same SSOT number.
      - name: Derive perf cache-key suffix from PhaseHookCount (BUG-735)
        shell: bash
        run: echo "PERF_KEY_SUFFIX=v12-hooks$(go run ./internal/harness/synth/cmd/perfci -print-hook-count)" >> "$GITHUB_ENV"

      # BUG-110/BUG-073 (same generation-bump rationale as perf-smoke's
      # v2 key above): the pre-fix 1m-real cache holds a record written
      # before PerfResult.Measured existed -- it unmarshals with
      # Measured=false, BUG-073's read-boundary check quarantines it,
      # and with zero usable records left LoadLatestBaseline hard-errors
      # (correctly: a corrupt history must not silently become a fresh
      # one). Live-caught on run 31539027958: the probe measured 1M
      # citizens fine and then could not record it. The v2 generation
      # orphans that unreadable history so the next dispatch records the
      # first REAL post-fix baseline.
      #
      # v3 (BUG-254, 2026-08-17): identical rationale to perf-smoke's v3
      # bump above — the measurement step now runs -months 500 (was 96, widened for BUG-271: BUG-269's speedup dropped the 96-month window below the 50ms floor)
      # with synth.TickSampleCount-median sampling and a window-scoped
      # noise floor, so every v2 record (Months=3) would ScaleMismatch
      # against the first v3-regime run. Since this job is REQUIRED and
      # exit 3 hard-fails it (see the GATE FLIP note above), comparing
      # across regimes would brick every merge; orphaning the v2 history
      # lets the first run under -months 500 seed the fresh baseline
      # (AC-8) instead.
      #
      # v8 (BUG-529, 2026-09-02, Aaron ruling Q100049=A1; fixed same day,
      # see perf-smoke's own v8/v8-FIX comment block above for the full
      # story): same rationale as perf-smoke's own v8 bump — BUG-529
      # fixed compose.residentIDs()'s money loop (it had silently paid
      # only ~64 of 2000 citizens; migrants/fertility children were
      # never enumerated), legitimately raising AllocBytes/AllocCount
      # ~247%/~386% at this job's full 1,000,000-citizen scale (locally
      # re-measured at BUG-547's landing commit 009cbf5: ~175M/~1.14M ->
      # ~610.0M/~5.56M). Orphaning v7 here (this job's history is a
      # SEPARATE cache key from perf-smoke's, so both must be bumped
      # independently) lets the very next dispatch establish a fresh,
      # honestly-measured baseline at the corrected level (AC-8).
      #
      # v8 FIX (same-day, 2026-09-02): the original landing also added a
      # perf-accepted-regressions.json entry naming commit 009cbf5 —
      # this hard-failed BOTH perf jobs (exit 2) because this job's
      # Checkout step (like perf-smoke's) takes actions/checkout@v4's
      # default SHALLOW clone (fetch-depth 1), and the ledger's git-
      # provenance loader (BUG-245) fails closed when a named commitHash
      # cannot be resolved in that shallow history — live-reproduced by
      # cloning the real repo with --depth 1 and running perfci against
      # it. The ledger entry was never load-bearing for the fix (the v8
      # cache-key bump alone already gives AC-8's fresh-baseline exit 0
      # on the first post-bump run), so perf-accepted-regressions.json
      # is back to an empty array.
      - name: Restore perf-results-1m-real baseline
        uses: actions/cache@v4
        with:
          path: perf-results-1m-real.ndjson
          key: perf-results-1m-real-${{ env.PERF_KEY_SUFFIX }}-${{ github.run_id }}
          restore-keys: |
            perf-results-1m-real-${{ env.PERF_KEY_SUFFIX }}-

      - name: Build perfci
        run: go build -o perfci.exe ./internal/harness/synth/cmd/perfci

      # PowerShell (GR#9) drives perfci.exe as a child process rather than
      # `go run`/inline `&` so PeakWorkingSet64 can be polled on the
      # actual measured process, not a `go run` wrapper process — the
      # same technique used to sanity-check order of magnitude locally
      # before this job was written (see this item's BOW report).
      #
      # BUG-095: this step used to also forward accept_perf_regression/
      # accept_perf_regression_reason workflow_dispatch inputs into
      # cmd/perfci's -accept-regression/-accept-reason flags -- both are
      # gone now (see the workflow_dispatch trigger's own comment above
      # for why). If perfci reports a regression or a could-not-evaluate
      # verdict for a commit a human has genuinely reviewed and wants to
      # accept, that acceptance is recorded by committing an entry to
      # perf-accepted-regressions.json (checked out into this job's
      # working directory along with the rest of the repo, and read from
      # the explicit -accepted-regressions path passed below -- ASM-375
      # wires it here AND in perf-smoke so both jobs share the same
      # hatch) BEFORE re-dispatching this job for that commit -- an
      # ordinary, reviewed PR, not a value typed into this form.
      - name: Measure real 1M-citizen run (wall time + peak memory)
        shell: pwsh
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = ".\perfci.exe"
          $psi.ArgumentList.Add("-preset"); $psi.ArgumentList.Add("1M")
          $psi.ArgumentList.Add("-months"); $psi.ArgumentList.Add("500")
          $psi.ArgumentList.Add("-results"); $psi.ArgumentList.Add("perf-results-1m-real.ndjson")
          $psi.ArgumentList.Add("-commit"); $psi.ArgumentList.Add("${{ github.sha }}")
          $psi.ArgumentList.Add("-accepted-regressions"); $psi.ArgumentList.Add("perf-accepted-regressions.json")
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($psi)
          $peak = 0
          while (-not $p.HasExited) {
            Start-Sleep -Milliseconds 200
            try { $p.Refresh(); if ($p.PeakWorkingSet64 -gt $peak) { $peak = $p.PeakWorkingSet64 } } catch {}
          }
          $sw.Stop()
          $stdout = $p.StandardOutput.ReadToEnd()
          $stderr = $p.StandardError.ReadToEnd()
          $peakMB = [math]::Round($peak / 1MB, 1)

          Write-Host "perfci exit code: $($p.ExitCode)"
          Write-Host "Wall time: $($sw.Elapsed)"
          Write-Host "Peak working set: $peakMB MB"
          Write-Host "--- perfci stdout ---"
          Write-Host $stdout
          if ($stderr) { Write-Host "--- perfci stderr ---"; Write-Host $stderr }

          "## perf-1m-probe results" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "- Wall time: $($sw.Elapsed)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "- Peak working set: $peakMB MB" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "- perfci message: $stdout" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "- Full per-phase timing, alloc counts and PhaseHookCount: see the uploaded perf-results-1m-real.ndjson artifact (one JSON line, human-readable)." | Out-File -Append $env:GITHUB_STEP_SUMMARY

          # BUG-034 gate semantics — see this job's header comment for
          # Aaron's ruling. This step's exit code IS the merge verdict.
          # FEAT-082 (BUG-034/ASM-352): real phase hooks now exist, so a
          # gate that cannot evaluate a real cost is a HARD failure, not a
          # warning — exit 3 propagates as a non-zero job outcome. The
          # ::warning:: is retained only as a diagnostic on the way down.
          if ($p.ExitCode -eq 3) {
            Write-Host "::warning title=1M gate could not evaluate::perfci exited 3 (could-not-evaluate). Real phase hooks now exist (FEAT-082), so a gate that cannot evaluate a real cost hard-fails the merge. Diagnostic: see the uploaded perf-results-1m-real.ndjson artifact and perfci stderr above."
          }
          exit $p.ExitCode

      - name: Upload measured result (ndjson + summary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-1m-probe-${{ github.run_id }}
          path: perf-results-1m-real.ndjson
          if-no-files-found: warn

      - name: Save perf-results-1m-real baseline (v8 generation, see restore step)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: perf-results-1m-real.ndjson
          key: perf-results-1m-real-${{ env.PERF_KEY_SUFFIX }}-${{ github.run_id }}

      # BUG-097: identical rationale to perf-smoke's own pruning step —
      # this job's cache key is also unique-per-run and would otherwise
      # accumulate one entry per run forever. It was originally rarer
      # (workflow_dispatch-only) than perf-smoke, but since the BUG-034
      # gate flip (commit 5bfc381) it runs on every push/PR at the same
      # cadence as perf-smoke, so the accumulation and the fix are the
      # same.
      - name: Prune old perf-results-1m-real caches (BUG-097)
        if: always()
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prefix = "perf-results-1m-real-$env:PERF_KEY_SUFFIX-"
          $keepNewest = 3
          $raw = gh cache list --repo ${{ github.repository }} --key $prefix --limit 100 --json id,key,createdAt
          if (-not $raw) { Write-Host "no cache entries listed under prefix $prefix"; exit 0 }
          $entries = $raw | ConvertFrom-Json
          $stale = $entries | Sort-Object -Property createdAt -Descending | Select-Object -Skip $keepNewest
          foreach ($e in $stale) {
            Write-Host "deleting stale cache entry $($e.key) (id $($e.id), created $($e.createdAt))"
            gh cache delete $e.id --repo ${{ github.repository }}
          }

  # --- BUG-665: THE REAL population-scale gate -------------------------
  #
  # perf-1m-probe above has never ticked 1,000,000 citizens (see its own
  # loud step annotation and job-header comment) -- it measures
  # internal/harness/synth's throwaway synthetic-record generation cost
  # against a genesis-only ~64-citizen city. This job is the actual
  # thing: it seeds a real citizens.CitizensAPI with 1,000,000
  # citizens.ColdRecord values (headless.Config.SeedCitizenCount, new
  # this commit) and drives them through 90 REAL day-ticks via
  # headless.Run's genuine protocol.Command path -- never
  # core.Engine.AdvanceTicks directly (see
  # TestPackage_NeverCallsAdvanceTicksDirectly).
  #
  # Self-testing gate: TestPopulationPerfGate1M
  # (internal/harness/headless/bug665_population_perf_gate_test.go) IS
  # the probe -- it seeds, ticks, measures, and asserts inside one Go
  # test, with `-v` so the measured numbers (perTick, TicksAdvanced,
  # cumulative TotalAlloc/citizen, final Population) are ALWAYS printed
  # to this job's log via t.Logf, pass or fail -- there is nothing
  # separate to build or wire up the way perf-1m-probe needs perfci.exe.
  #
  # Bounds are DELIBERATELY GENEROUS on this first landing (see
  # popPerfGateTickBoundPerTick's and
  # popPerfGateAllocBytesPerCitizenBound's own doc comments in that test
  # file for the exact multiples and the tightening plan) -- per the
  # house rule this item's own build session re-learned three times in
  # one day: a bound must come from the machine that enforces it, not
  # from a different box's one-off measurement. The FIRST real run of
  # this job on CI establishes that machine's own baseline; a follow-up
  # commit tightens the two constants against the CI-measured median
  # this job's log will show, not a guess.
  #
  # ROUND-2 UPDATE (2026-09-04): an independent destructive round found
  # the FIRST landing's seeded population invisible to BOTH fertility
  # (no real partner/household) and moneycirc (never enumerated by
  # compose's own resident set) -- so its 21-30 ms/tick reading measured
  # an effectively idle ~64-citizen city, not 1,000,000 residents. The
  # fix (generateSeedPopulation pairs a childbearing-age fraction into
  # real households, SeedHouseholds registers them, compose.Deps.
  # SeedResidentIDBase/SeedResidentIDCount makes them moneycirc-visible)
  # makes the population genuinely live -- and the real number is far
  # worse: ~1.3-1.4 s/tick on this dev box (fertility's O(N^2/7680) term
  # plus moneycirc's four O(N^2/256) monthly terms, both now executing
  # for real against citizens.CitizensAPI.ColdShard's un-indexed rowOf
  # linear scan -- BUG-666's id->row index has not landed on main yet).
  # popPerfGateTickBoundPerTick/popPerfGateAllocBytesPerCitizenBound were
  # re-derived against THIS number, not the earlier vacuous one -- see
  # that test file's own "ROUND-2 FINDING" doc comment for the full
  # story and the BUG-666 re-measurement this gate still owes once that
  # index lands.
  #
  # NOT required (yet): unlike perf-1m-probe, this job does not (yet)
  # appear on branch protection's required-checks list -- see BUG-665's
  # BOW report for Aaron's/the lead's decision on promoting it to
  # required once its first few CI runs have established a real
  # CI-measured baseline and the tightened bounds are landed. Until
  # then it still runs on every push/PR (so its signal is visible
  # immediately) but a failure here does not itself block a merge.
  #
  # timeout-minutes: local measurement (this item's own dev box, see the
  # test's own doc comment) is ~2 MINUTES total (seed + wire + 90 REAL,
  # demographically-live ticks + snapshot write) for 1,000,000 citizens
  # across 3 simulated months, post-round-2-fix -- 10 minutes leaves
  # generous headroom for a slower/noisier shared CI runner without
  # masking a genuine multi-minute regression the way an
  # hour-long timeout would.
  perf-population-probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Seed + tick 1,000,000 citizens (BUG-665 real population gate)
        shell: pwsh
        run: |
          go test ./internal/harness/headless/... -run TestPopulationPerfGate1M -v -count=1 -timeout 8m
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=perf-population-probe failed (BUG-665)::TestPopulationPerfGate1M did not pass -- see the test output above for the exact measured perTick/AllocBytes-per-citizen figure and which bound it exceeded (internal/harness/headless/bug665_population_perf_gate_test.go)."
          }
          exit $LASTEXITCODE
